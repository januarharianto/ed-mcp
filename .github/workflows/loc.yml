name: Update LOC badge

on:
  push:
    branches: [main]
    paths: ["src/**"]

permissions:
  contents: write

jobs:
  loc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count lines of code
        run: |
          sudo apt-get install -y -qq cloc > /dev/null 2>&1
          COUNT=$(cloc --json src/ | python3 -c "import sys,json; print(json.load(sys.stdin)['SUM']['code'])")
          echo "{\"schemaVersion\":1,\"label\":\"lines of code\",\"message\":\"$COUNT\",\"color\":\"blue\"}" > .github/badges/loc.json

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/loc.json
          git diff --staged --quiet || git commit -m "chore: update LOC badge [skip ci]" && git push
