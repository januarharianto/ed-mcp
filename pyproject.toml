[project]
name = "edstem-mcp"
version = "0.1.0"
description = "MCP server for Ed Discussion (edstem.org)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edstem_mcp"]
