[project]
name = "edstem-mcp"
dynamic = ["version"]
description = "MCP server for Ed Discussion (edstem.org)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/edstem_mcp/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/edstem_mcp"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
version_files = ["src/edstem_mcp/__about__.py:__version__"]
update_changelog_on_bump = true
tag_format = "v$version"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "commitizen>=4.13.6",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
]
